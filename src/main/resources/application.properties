# ---------- PostgreSQL (somente leitura) ----------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.datasource.jdbc.additional-jdbc-properties.readOnly=true

# Produção: dados vêm de variáveis de ambiente, nada fixo no arquivo
%prod.quarkus.datasource.jdbc.url=${PG_URL}
%prod.quarkus.datasource.username=${PG_USER}
%prod.quarkus.datasource.password=${PG_PASSWORD}

# Dev: o Dev Services sobe um Postgres vazio, então aqui o Hibernate
# cria as tabelas e carrega o import.sql com dados de teste
#%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
#%dev.quarkus.datasource.jdbc.additional-jdbc-properties.readOnly=false

# ---------- MongoDB PROD (escrita) ----------
quarkus.mongodb.credentials.auth-source=${MONGO_CRED}
quarkus.mongodb.database=storage
%prod.quarkus.mongodb.connection-string=${MONGO_URL}
%prod.quarkus.mongodb.credentials.username=${MONGO_USER}
%prod.quarkus.mongodb.credentials.password=${MONGO_PASSWORD}

# ---------- MongoDB DEV (escrita) ----------
%dev.quarkus.mongodb.connection-string=${MONGO_URL}
%dev.quarkus.mongodb.credentials.username=${MONGO_USER}
%dev.quarkus.mongodb.credentials.password=${MONGO_PASSWORD}

# ---------- Porta ----------
quarkus.http.port=${HTTP_PORT}
quarkus.http.ssl-port=${HTTPS_PORT}

# ---------- Upload ----------
# O padrão do Quarkus (10 MB) barraria vídeos; precisa comportar o maior limite de TipoMidia.Categoria
quarkus.http.limits.max-body-size=2G

# ---------- Swagger / OpenAPI ----------
# Contrato em /q/openapi e tela interativa em /q/swagger-ui.
# A documentação em si está nas anotações do MidiaResource, dos DTOs e da classe config.OpenApiDefinicao.
quarkus.swagger-ui.title=Storage de Mídias
quarkus.swagger-ui.try-it-out-enabled=true
quarkus.swagger-ui.display-request-duration=true
quarkus.swagger-ui.deep-linking=true
# O Swagger UI só existe em dev e test; para expor também em produção, descomentar a linha abaixo
#quarkus.swagger-ui.always-include=true

# ---------- Log ----------
# Formotação de data e hora
quarkus.log.console.format=%d{dd/MM/yyyy HH:mm:ss,SSS} %-5p [%X{requisicao}] %c{1} - %s%e%n

# ---------- Log JSON (produção) ----------
# Para ativar: descomentar a dependência quarkus-logging-json no pom.xml e as linhas abaixo.
# Só o perfil prod sai em JSON; em dev o log continua no formato texto acima.
# O id de rastreio (LogPadrao.CHAVE_RASTREIO) vai no campo "mdc": {"requisicao": "..."}.
